<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Lie to Me 对白</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --font-size: 16px;
    }
    .markdown-section {
      font-size: var(--font-size) !important;
      line-height: 1.7;
    }
    mark, .highlight {
      background-color: #ffe066;
      padding: 1px 2px;
      border-radius: 2px;
    }
    #controls {
      position: fixed;
      top: 12px;
      right: 20px;
      z-index: 100;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 14px;
    }
    #controls button {
      border: 1px solid #ccc;
      background: #f8f8f8;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 14px;
    }
    #controls button:hover {
      background: #eee;
    }
    #font-size-label {
      min-width: 36px;
      text-align: center;
    }
    /* 悬停选词时的提示 */
    .hover-select-active {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="changeFont(-1)" title="缩小字体">A-</button>
    <span id="font-size-label">16</span>
    <button onclick="changeFont(1)" title="放大字体">A+</button>
    <button onclick="highlightSelection()" title="高亮选中文字 (或按 H 键)">高亮</button>
    <button onclick="clearHighlights()" title="清除所有高亮">清除</button>
    <button id="hover-btn" onclick="toggleHoverSelect()" title="开启/关闭悬停选词">悬停选词: 关</button>
  </div>

  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: 'Lie to Me',
      loadSidebar: 'sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      homepage: 's01/e01.md'
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <script>
    // ========== 字体大小 ==========
    let currentSize = parseInt(localStorage.getItem('lie-font-size')) || 16;
    document.documentElement.style.setProperty('--font-size', currentSize + 'px');
    document.getElementById('font-size-label').textContent = currentSize;

    function changeFont(delta) {
      currentSize = Math.min(28, Math.max(12, currentSize + delta));
      document.documentElement.style.setProperty('--font-size', currentSize + 'px');
      document.getElementById('font-size-label').textContent = currentSize;
      localStorage.setItem('lie-font-size', currentSize);
    }

    // ========== 高亮功能 ==========
    function highlightSelection() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const mark = document.createElement('mark');
      try {
        range.surroundContents(mark);
      } catch (e) {
        const span = document.createElement('span');
        span.className = 'highlight';
        span.appendChild(range.extractContents());
        range.insertNode(span);
      }
      selection.removeAllRanges();
      saveHighlights();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key.toLowerCase() === 'h' && !e.ctrlKey && !e.metaKey) {
        const active = document.activeElement;
        if (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') return;
        highlightSelection();
      }
    });

    function saveHighlights() {
      const section = document.querySelector('.markdown-section');
      if (!section) return;
      const path = location.hash || '#/';
      let data = JSON.parse(localStorage.getItem('lie-highlights') || '{}');
      data[path] = section.innerHTML;
      localStorage.setItem('lie-highlights', JSON.stringify(data));
    }

    function restoreHighlights() {
      const section = document.querySelector('.markdown-section');
      if (!section) return;
      const path = location.hash || '#/';
      const data = JSON.parse(localStorage.getItem('lie-highlights') || '{}');
      if (data[path]) {
        section.innerHTML = data[path];
      }
    }

    function clearHighlights() {
      const section = document.querySelector('.markdown-section');
      if (!section) return;
      section.querySelectorAll('mark, .highlight').forEach(el => {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      });
      saveHighlights();
    }

    // ========== 悬停自动选中单词 ==========
    let hoverSelectEnabled = localStorage.getItem('lie-hover-select') === 'true';

    function toggleHoverSelect() {
      hoverSelectEnabled = !hoverSelectEnabled;
      localStorage.setItem('lie-hover-select', hoverSelectEnabled);
      updateHoverButton();
      const section = document.querySelector('.markdown-section');
      if (section) {
        section.classList.toggle('hover-select-active', hoverSelectEnabled);
      }
    }

    function updateHoverButton() {
      const btn = document.getElementById('hover-btn');
      btn.textContent = '悬停选词: ' + (hoverSelectEnabled ? '开' : '关');
    }

    // 根据鼠标位置选中单词
    function selectWordAtPoint(x, y) {
      let range;
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(x, y);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(x, y);
        range = document.createRange();
        range.setStart(pos.offsetNode, pos.offset);
      }
      if (!range) return;

      const node = range.startContainer;
      if (node.nodeType !== Node.TEXT_NODE) return;

      const text = node.textContent;
      let start = range.startOffset;
      let end = start;

      // 向左找到单词边界
      while (start > 0 && /[\w''-]/.test(text[start - 1])) {
        start--;
      }
      // 向右找到单词边界
      while (end < text.length && /[\w''-]/.test(text[end])) {
        end++;
      }

      if (start === end) return;

      const sel = window.getSelection();
      sel.removeAllRanges();
      const wordRange = document.createRange();
      wordRange.setStart(node, start);
      wordRange.setEnd(node, end);
      sel.addRange(wordRange);
    }

    // 监听鼠标移动
    let hoverTimer = null;
    document.addEventListener('mousemove', function(e) {
      if (!hoverSelectEnabled) return;
      const section = document.querySelector('.markdown-section');
      if (!section || !section.contains(e.target)) return;

      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => {
        selectWordAtPoint(e.clientX, e.clientY);
      }, 80); // 轻微延迟，避免太灵敏
    });

    // 页面切换后恢复
    window.addEventListener('hashchange', function() {
      setTimeout(() => {
        restoreHighlights();
        const section = document.querySelector('.markdown-section');
        if (section) section.classList.toggle('hover-select-active', hoverSelectEnabled);
      }, 300);
    });

    // 初始化
    updateHoverButton();
    setTimeout(() => {
      restoreHighlights();
      const section = document.querySelector('.markdown-section');
      if (section) section.classList.toggle('hover-select-active', hoverSelectEnabled);
    }, 800);
  </script>
</body>
</html>
