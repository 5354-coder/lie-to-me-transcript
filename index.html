<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Lie to Me 对白</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* 1. 右上角字体大小调节面板 */
    .font-size-control {
      position: fixed;
      top: 12px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      user-select: none;
    }
    .font-size-control button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .font-size-control button:hover {
      background: #f0f0f0;
    }

    /* 高亮文本样式 */
    mark.user-highlight {
      background-color: #ffeb3b;
      color: inherit;
      padding: 2px 0;
      border-radius: 2px;
    }

    /* 2. 居中且与页面融合的半透明高亮菜单 */
    .highlight-menu {
      position: absolute;
      z-index: 1000;
      display: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 4px 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      gap: 6px;
      transform: translateX(-50%);
    }
    .highlight-menu button {
      background: transparent;
      color: #333;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .highlight-menu button:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .highlight-menu button.danger {
      color: #d93025;
    }
    .highlight-menu button.danger:hover {
      background: rgba(217, 48, 37, 0.1);
    }
  </style>
</head>
<body>
  <!-- 字体大小控制按钮 -->
  <div class="font-size-control">
    <span>字号</span>
    <button id="btn-decrease">-</button>
    <span id="font-size-val">16px</span>
    <button id="btn-increase">+</button>
  </div>

  <!-- 高亮/清除操作菜单 -->
  <div id="highlight-menu" class="highlight-menu">
    <button id="btn-do-highlight">高亮</button>
    <button id="btn-clear-highlights" class="danger">清除高亮</button>
  </div>

  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: 'Lie to Me',
      loadSidebar: 'sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      homepage: 's01/e01.md'
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <script>
    // --- 1. 仅针对右侧内容区 (.content) 的字号调节 ---
    let currentFontSize = parseInt(localStorage.getItem('user_font_size')) || 16;
    
    function updateFontSize(size) {
      currentFontSize = Math.min(Math.max(size, 12), 32);
      
      let styleEl = document.getElementById('custom-font-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'custom-font-style';
        document.head.appendChild(styleEl);
      }
      styleEl.innerHTML = `.content { font-size: ${currentFontSize}px !important; }`;
      
      document.getElementById('font-size-val').innerText = currentFontSize + 'px';
      localStorage.setItem('user_font_size', currentFontSize);
    }

    document.getElementById('btn-increase').addEventListener('click', () => updateFontSize(currentFontSize + 2));
    document.getElementById('btn-decrease').addEventListener('click', () => updateFontSize(currentFontSize - 2));
    updateFontSize(currentFontSize);


    // --- 2. 鼠标双击选词逻辑 ---
    document.addEventListener('dblclick', function () {
      const selection = window.getSelection();
      if (!selection.isCollapsed) return;

      const range = document.caretRangeFromPoint
        ? document.caretRangeFromPoint(event.clientX, event.clientY)
        : document.caretPositionFromPoint
          ? (function(pos) {
              if (!pos) return null;
              const r = document.createRange();
              r.setStart(pos.offsetNode, pos.offset);
              r.collapse(true);
              return r;
            })(document.caretPositionFromPoint(event.clientX, event.clientY))
          : null;

      if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) return;

      const textNode = range.startContainer;
      const offset = range.startOffset;
      const text = textNode.nodeValue;

      let start = offset, end = offset;
      while (start > 0 && /[\w'-]/.test(text[start - 1])) start--;
      while (end < text.length && /[\w'-]/.test(text[end])) end++;

      if (start < end) {
        const wordRange = document.createRange();
        wordRange.setStart(textNode, start);
        wordRange.setEnd(textNode, end);
        selection.removeAllRanges();
        selection.addRange(wordRange);
      }
    });


    // --- 3. 按 Ctrl 键弹出高亮菜单（仅保留“高亮”和“清除高亮”）---
    const menu = document.getElementById('highlight-menu');
    let savedRange = null;

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Control' || e.ctrlKey) {
        const selection = window.getSelection();
        if (selection && !selection.isCollapsed && selection.toString().trim() !== '') {
          savedRange = selection.getRangeAt(0).cloneRange();
          const rect = savedRange.getBoundingClientRect();
          
          // 定位至选中文本的正中间上方
          const middleX = rect.left + (rect.width / 2) + window.scrollX;
          const topY = rect.top + window.scrollY - 45;
          
          menu.style.left = `${middleX}px`;
          menu.style.top = `${topY}px`;
          menu.style.display = 'flex';
        }
      }
    });

    // 点击其他位置隐藏菜单
    document.addEventListener('mousedown', function (e) {
      if (!menu.contains(e.target)) {
        menu.style.display = 'none';
      }
    });

    // 点击“高亮”按钮
    document.getElementById('btn-do-highlight').addEventListener('click', function () {
      if (!savedRange) return;
      const mark = document.createElement('mark');
      mark.className = 'user-highlight';
      
      try {
        savedRange.surroundContents(mark);
      } catch (err) {
        const fragment = savedRange.extractContents();
        mark.appendChild(fragment);
        savedRange.insertNode(mark);
      }
      
      window.getSelection().removeAllRanges();
      menu.style.display = 'none';
      savedRange = null;
    });

    // 点击“清除高亮”按钮：彻底清除所有历史高亮
    document.getElementById('btn-clear-highlights').addEventListener('click', function () {
      const highlights = document.querySelectorAll('mark.user-highlight');
      highlights.forEach(mark => {
        const parent = mark.parentNode;
        while (mark.firstChild) {
          parent.insertBefore(mark.firstChild, mark);
        }
        parent.removeChild(mark);
        parent.normalize();
      });
      
      window.getSelection().removeAllRanges();
      menu.style.display = 'none';
      savedRange = null;
    });
  </script>
</body>
</html>
